name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DULTIMATE_BUILD_VULKAN=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item build/Release/ultimate_fps.exe dist/ULTIMATE_FPS.exe
          Copy-Item build/Release/assetctl.exe dist/assetctl.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ULTIMATE_FPS-Windows-x64
          path: dist/*
